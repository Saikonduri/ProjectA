<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOGIN // PLAYER ONE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap');

    :root {
      --neon-purple: #bf00ff;
      --neon-cyan: #00f5ff;
      --neon-pink: #ff006e;
      --neon-green: #39ff14;
      --bg-dark: #0a0a0f;
      --bg-card: rgba(255,255,255,0.04);
      --border: rgba(191,0,255,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--bg-dark);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(191,0,255,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(191,0,255,0.07) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridMove {
      0%   { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--neon-purple); top: -100px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 350px; height: 350px; background: var(--neon-cyan); bottom: -80px; right: -80px; animation-delay: -4s; }
    .orb-3 { width: 200px; height: 200px; background: var(--neon-pink); top: 50%; left: 50%; animation-delay: -2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(-30px) scale(1.05); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 10;
      width: min(420px, 92vw);
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 0 60px rgba(191,0,255,0.15), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* XP bar at top */
    .xp-bar-wrap {
      margin-bottom: 28px;
    }
    .xp-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-family: 'Orbitron', monospace;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .xp-bar {
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
    }
    .xp-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan));
      border-radius: 99px;
      transition: width 0.6s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 0 8px var(--neon-cyan);
    }

    /* Header */
    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .pixel-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 16px rgba(191,0,255,0.5);
      animation: pulse-icon 2s ease-in-out infinite;
    }
    @keyframes pulse-icon {
      0%, 100% { box-shadow: 0 0 16px rgba(191,0,255,0.5); }
      50%       { box-shadow: 0 0 28px rgba(191,0,255,0.9); }
    }
    .title {
      font-family: 'Orbitron', monospace;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(90deg, #fff 30%, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 28px;
      letter-spacing: 0.04em;
    }

    /* Achievement toast */
    .achievement {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 100;
      background: rgba(10,10,15,0.95);
      border: 1px solid var(--neon-green);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      box-shadow: 0 0 20px rgba(57,255,20,0.3);
      transform: translateX(120%);
      transition: transform 0.4s cubic-bezier(.34,1.56,.64,1);
      max-width: 280px;
    }
    .achievement.show { transform: translateX(0); }
    .achievement-icon { font-size: 22px; }
    .achievement-text strong { display: block; color: var(--neon-green); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-family: 'Orbitron', monospace; }
    .achievement-text span { color: rgba(255,255,255,0.7); font-size: 12px; }

    /* Floating XP pop */
    .xp-pop {
      position: fixed;
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan);
      pointer-events: none;
      z-index: 200;
      animation: xpFloat 1.2s ease-out forwards;
    }
    @keyframes xpFloat {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
    }

    /* Form */
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-family: 'Orbitron', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 8px;
    }
    .field label .field-status {
      color: var(--neon-green);
      font-size: 10px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .field label .field-status.visible { opacity: 1; }

    .input-wrap {
      position: relative;
    }
    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 13px 44px 13px 16px;
      color: #fff;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }
    .input-wrap input::placeholder { color: rgba(255,255,255,0.2); }
    .input-wrap input:focus {
      border-color: var(--neon-purple);
      box-shadow: 0 0 0 3px rgba(191,0,255,0.15), 0 0 16px rgba(191,0,255,0.1);
      background: rgba(191,0,255,0.06);
    }
    .input-wrap input.valid {
      border-color: var(--neon-green);
      box-shadow: 0 0 0 3px rgba(57,255,20,0.1);
    }
    .input-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
      opacity: 0.4;
      transition: opacity 0.3s;
    }
    .input-wrap input:focus ~ .input-icon { opacity: 0.9; }

    /* Password strength */
    .strength-bar {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      height: 3px;
    }
    .strength-bar span {
      flex: 1;
      border-radius: 99px;
      background: rgba(255,255,255,0.1);
      transition: background 0.3s;
    }
    .strength-bar span.active-1 { background: var(--neon-pink); }
    .strength-bar span.active-2 { background: #ffaa00; }
    .strength-bar span.active-3 { background: var(--neon-green); }
    .strength-label {
      font-size: 10px;
      margin-top: 5px;
      font-family: 'Orbitron', monospace;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.35);
      transition: color 0.3s;
      min-height: 14px;
    }

    /* Checkbox */
    .remember-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      cursor: pointer;
      user-select: none;
    }
    .remember-row input[type=checkbox] { display: none; }
    .custom-check {
      width: 18px;
      height: 18px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 5px;
      background: rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      flex-shrink: 0;
    }
    .remember-row input:checked ~ .custom-check {
      background: var(--neon-purple);
      border-color: var(--neon-purple);
      box-shadow: 0 0 10px rgba(191,0,255,0.5);
    }
    .check-mark { font-size: 11px; opacity: 0; transition: opacity 0.2s; }
    .remember-row input:checked ~ .custom-check .check-mark { opacity: 1; }
    .remember-text { font-size: 13px; color: rgba(255,255,255,0.5); }

    /* CTA button */
    .btn-login {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-pink) 100%);
      color: #fff;
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.3s;
      box-shadow: 0 4px 24px rgba(191,0,255,0.4);
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(191,0,255,0.6);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s;
    }
    .btn-login:hover::before { left: 100%; }
    .btn-login.loading { pointer-events: none; }
    .btn-text { transition: opacity 0.2s; }
    .btn-loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn-login.loading .btn-text { opacity: 0; }
    .btn-login.loading .btn-loader { opacity: 1; }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: rgba(255,255,255,0.2);
      font-size: 11px;
      letter-spacing: 0.08em;
      font-family: 'Orbitron', monospace;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }

    /* Social buttons */
    .social-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .btn-social {
      flex: 1;
      padding: 11px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.25s;
      font-family: 'Inter', sans-serif;
    }
    .btn-social:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.25);
      color: #fff;
      transform: translateY(-1px);
    }

    /* Footer */
    .footer-text {
      text-align: center;
      font-size: 12.5px;
      color: rgba(255,255,255,0.35);
    }
    .footer-text a {
      color: var(--neon-cyan);
      text-decoration: none;
      font-weight: 600;
      transition: text-shadow 0.2s;
    }
    .footer-text a:hover { text-shadow: 0 0 12px var(--neon-cyan); }

    /* Stats strip */
    .stats {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .stat {
      text-align: center;
      flex: 1;
    }
    .stat-val {
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-key {
      font-size: 9px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 2px;
      font-family: 'Orbitron', monospace;
    }

    /* Particles */
    .particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      background: var(--neon-cyan);
      border-radius: 50%;
      opacity: 0;
      animation: particleFly linear infinite;
    }
    @keyframes particleFly {
      0%   { opacity: 0; transform: translateY(0) scale(0); }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-120vh) scale(1); }
    }

    /* Glitch on title hover */
    .title:hover {
      animation: glitch 0.3s ease;
    }
    @keyframes glitch {
      0%  { transform: translate(0); }
      20% { transform: translate(-2px, 1px); filter: hue-rotate(90deg); }
      40% { transform: translate(2px, -1px); filter: hue-rotate(-90deg); }
      60% { transform: translate(-1px, 2px); }
      80% { transform: translate(1px, -1px); }
      100%{ transform: translate(0); filter: none; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="particles" id="particles"></div>

  <!-- Achievement toast -->
  <div class="achievement" id="achievement">
    <div class="achievement-icon" id="achIcon">🏆</div>
    <div class="achievement-text">
      <strong>Achievement Unlocked</strong>
      <span id="achText">You exist!</span>
    </div>
  </div>

  <div class="card">

    <!-- XP bar -->
    <div class="xp-bar-wrap">
      <div class="xp-label">
        <span>LOGIN XP</span>
        <span id="xpCount">0 / 100 XP</span>
      </div>
      <div class="xp-bar">
        <div class="xp-fill" id="xpFill"></div>
      </div>
    </div>

    <div class="logo-row">
      <div class="pixel-icon">⚡</div>
      <span class="title">PLAYER.ONE</span>
    </div>
    <p class="subtitle">authenticate to unlock your universe &nbsp;✦</p>

    <!-- Form -->
    <form id="loginForm" autocomplete="off">

      <div class="field">
        <label>
          <span>// username</span>
          <span class="field-status" id="userStatus">✓ VALID</span>
        </label>
        <div class="input-wrap">
          <input type="text" id="username" placeholder="enter your gamer tag..." autocomplete="off" />
          <span class="input-icon">👾</span>
        </div>
      </div>

      <div class="field">
        <label>
          <span>// passphrase</span>
          <span class="field-status" id="passStatus">✓ VALID</span>
        </label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="super secret stuff..." autocomplete="off" />
          <span class="input-icon">🔐</span>
        </div>
        <div class="strength-bar">
          <span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span>
        </div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>

      <label class="remember-row">
        <input type="checkbox" id="rememberMe" />
        <div class="custom-check"><span class="check-mark">✓</span></div>
        <span class="remember-text">keep me logged in (trust the vibes)</span>
      </label>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text">🚀 &nbsp;ENTER THE VOID</span>
        <div class="btn-loader"><div class="spinner"></div></div>
      </button>

    </form>

    <div class="divider">or vibe with</div>

    <div class="social-row">
      <button class="btn-social" onclick="socialLogin('Google')">

        Google
      </button>
      <button class="btn-social" onclick="socialLogin('Discord')">

        GitHub
      </button>
    </div>

    <p class="footer-text">no account? <a href="#" onclick="signupClick()">create one, bestie →</a></p>

    <!-- Stats strip -->
    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="statPlayers">2.4M</div>
        <div class="stat-key">players</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statOnline">8.2K</div>
        <div class="stat-key">online</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statLevel">99+</div>
        <div class="stat-key">max lvl</div>
      </div>
    </div>

  </div>

  <script>
    // ---- Particles ----
    const pContainer = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        animation-duration: ${6 + Math.random() * 10}s;
        animation-delay: ${Math.random() * 12}s;
        background: ${['#00f5ff','#bf00ff','#ff006e'][Math.floor(Math.random()*3)]};
        width: ${1 + Math.random()*2}px;
        height: ${1 + Math.random()*2}px;
      `;
      pContainer.appendChild(p);
    }

    // ---- XP system ----
    let xp = 0;
    const achievements = {
      firstChar:  { icon: '⌨️',  text: 'Started typing — brave soul',   points: 10, shown: false },
      validEmail: { icon: '📧',  text: 'Valid username — noice',          points: 20, shown: false },
      strongPass: { icon: '🔒',  text: 'Strong password — we respect',   points: 30, shown: false },
      rememberMe: { icon: '🧠',  text: 'Trust the vibes unlocked',       points: 10, shown: false },
      signup:     { icon: '✨',  text: 'Curious about signup — legend',  points: 5,  shown: false },
      social:     { icon: '🌐',  text: 'Social speedrun attempt',        points: 15, shown: false },
    };

    function addXP(key) {
      const a = achievements[key];
      if (!a || a.shown) return;
      a.shown = true;
      xp = Math.min(100, xp + a.points);
      document.getElementById('xpFill').style.width = xp + '%';
      document.getElementById('xpCount').textContent = xp + ' / 100 XP';
      showAchievement(a.icon, a.text);
      spawnXPPop('+' + a.points + ' XP');
    }

    function showAchievement(icon, text) {
      const el = document.getElementById('achievement');
      document.getElementById('achIcon').textContent = icon;
      document.getElementById('achText').textContent = text;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 3000);
    }

    function spawnXPPop(label) {
      const el = document.createElement('div');
      el.className = 'xp-pop';
      el.textContent = label;
      el.style.cssText = `left:${20 + Math.random()*60}%;top:${30 + Math.random()*40}%;`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1300);
    }

    // ---- Username field ----
    const usernameEl = document.getElementById('username');
    let userTyped = false;
    usernameEl.addEventListener('input', () => {
      if (!userTyped && usernameEl.value.length > 0) {
        userTyped = true;
        addXP('firstChar');
      }
      const valid = usernameEl.value.length >= 3;
      const status = document.getElementById('userStatus');
      if (valid) {
        usernameEl.classList.add('valid');
        status.classList.add('visible');
        addXP('validEmail');
      } else {
        usernameEl.classList.remove('valid');
        status.classList.remove('visible');
      }
    });

    // ---- Password field ----
    const passwordEl = document.getElementById('password');
    const bars = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3'), document.getElementById('s4')];
    const strengthLabels = ['', '🧅 weak af', '🔥 mid tbh', '💪 decent', '🛡️ built different'];
    let strongUnlocked = false;

    passwordEl.addEventListener('input', () => {
      const val = passwordEl.value;
      let score = 0;
      if (val.length >= 6)  score++;
      if (val.length >= 10) score++;
      if (/[^a-zA-Z0-9]/.test(val)) score++;
      if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;

      bars.forEach((b, i) => {
        b.className = '';
        if (i < score) {
          b.classList.add(score <= 1 ? 'active-1' : score <= 2 ? 'active-2' : 'active-3');
        }
      });
      document.getElementById('strengthLabel').textContent = strengthLabels[score] || '';

      const status = document.getElementById('passStatus');
      if (score >= 3) {
        passwordEl.classList.add('valid');
        status.classList.add('visible');
        if (!strongUnlocked) { strongUnlocked = true; addXP('strongPass'); }
      } else {
        passwordEl.classList.remove('valid');
        status.classList.remove('visible');
      }
    });

    // ---- Remember me ----
    document.getElementById('rememberMe').addEventListener('change', (e) => {
      if (e.target.checked) addXP('rememberMe');
    });

    // ---- Social login ----
    function socialLogin(provider) {
      addXP('social');
      showAchievement('🌐', provider + ' speedrun — let\'s gooo');
      spawnXPPop(provider + '!');
    }

    // ---- Signup link ----
    function signupClick() {
      addXP('signup');
    }

    // ---- Form submit ----
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.classList.add('loading');

      await new Promise(r => setTimeout(r, 1800));

      btn.classList.remove('loading');
      const u = usernameEl.value.trim();
      const p = passwordEl.value;

      if (u.length < 3 || p.length < 4) {
        showAchievement('😬', 'Fill it in properly bestie');
        btn.style.background = 'linear-gradient(135deg, #ff006e, #ff4444)';
        setTimeout(() => btn.style.background = '', 1000);
        return;
      }

      xp = 100;
      document.getElementById('xpFill').style.width = '100%';
      document.getElementById('xpCount').textContent = '100 / 100 XP';
      showAchievement('🎉', 'GG EZ — you\'re in bestie!');
      spawnXPPop('LEVEL UP!');
      btn.textContent = '✅ AUTHENTICATED';
      btn.style.background = 'linear-gradient(135deg, #39ff14, #00f5ff)';
    });

    // ---- Konami easter egg ----
    const konami = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
    let konamiIdx = 0;
    document.addEventListener('keydown', (e) => {
      if (e.key === konami[konamiIdx]) {
        konamiIdx++;
        if (konamiIdx === konami.length) {
          konamiIdx = 0;
          showAchievement('🕹️', 'Konami Code — no cap, you\'re a legend');
          spawnXPPop('SECRET +50 XP');
          xp = Math.min(100, xp + 50);
          document.getElementById('xpFill').style.width = xp + '%';
          document.getElementById('xpCount').textContent = xp + ' / 100 XP';
        }
      } else {
        konamiIdx = 0;
      }
    });
  </script>
</body>
</html>
